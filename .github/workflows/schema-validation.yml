name: Schema Validation

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - ".github/workflows/schema-validation.yml"
  pull_request:
    paths:
      - "schemas/**"
      - ".github/workflows/schema-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON Schemas and examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate schema documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("schemas").glob("*.schema.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("$schema"), f"Missing $schema: {path}"
              assert data.get("type") == "object", f"Expected object schema: {path}"

          for path in Path("schemas/examples").glob("*.example.json"):
              json.loads(path.read_text(encoding="utf-8"))

          print("Schema and example JSON validation passed.")
          PY
